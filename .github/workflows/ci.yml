name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake pkg-config python3 python3-pip libssl-dev libsqlite3-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm cmake pkg-config python openssl@3 sqlite3

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install make llvm --no-progress --yes

      - name: Build test suite
        shell: bash
        run: make -j2 tests

      - name: Run test suite on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          FT_TEST_HIDE_SUCCESSFUL: '1'
        run: ./Test/libft_tests

      - name: Run test suite on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          FT_TEST_HIDE_SUCCESSFUL: '1'
        run: ./Test/libft_tests.exe
