name: Build and test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential clang cmake gdb pkg-config python3 python3-pip libssl-dev libsqlite3-dev libx11-dev libxext-dev libxi-dev libgl-dev libasound2-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install llvm cmake pkg-config python openssl@3 sqlite3

      - name: Free macOS runner disk space
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew cleanup --prune=all || true
          rm -rf "$HOME/Library/Developer/Xcode/DerivedData"
          rm -rf "$HOME/.cocoapods"
          df -h

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install make llvm --no-progress --yes

      - name: Build test suite
        shell: bash
        run: make -j4 tests

      - name: Validate stale build progress
        shell: bash
        run: sh mk/test_build_progress.sh make

      - name: Validate release archives
        shell: bash
        run: make -j4 archive-integrity

      - name: Run test suite on Unix
        if: runner.os != 'Windows'
        shell: bash
        id: unix_tests
        env:
          FT_TEST_HIDE_SUCCESSFUL: '1' # CI_DIAGNOSTIC: Keep successful tests out of the Actions log to avoid exhausting runner storage.
          FT_TEST_PRESERVE_FAILURE_LOG: '1' # CI_DIAGNOSTIC: Preserve assertion details for failed Unix runs.
        run: | # CI_DIAGNOSTIC: Capture the complete Unix test output while preserving the test exit status.
          set +e
          set -o pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            (
              cd Test || exit 1
              ulimit -c 0 # CI_DIAGNOSTIC: Expected abort tests must not create one core file per child process.
              printf '%s\n' "macOS automatic core dump limit: $(ulimit -c)" # CI_DIAGNOSTIC: Keep LLDB's explicit hang core capture available without filling the runner disk.
              ./libft_tests > ci_unix_full_output.log 2>&1 &
              test_pid=$!
              tail -f ci_unix_full_output.log &
              tail_pid=$!
              last_output_size=-1
              idle_seconds=0
              while kill -0 "$test_pid" 2>/dev/null; do
                output_size=$(wc -c < ci_unix_full_output.log)
                if [ "$output_size" -eq "$last_output_size" ]; then
                  idle_seconds=$((idle_seconds + 5))
                else
                  last_output_size="$output_size"
                  idle_seconds=0
                fi
                if [ "$idle_seconds" -ge 180 ]; then
                  printf '%s\n' "macOS test process stalled for 180 seconds; collecting diagnostics."
                  touch ci_macos_hang_detected.txt
                  kill "$tail_pid" 2>/dev/null || true
                  wait "$tail_pid" 2>/dev/null || true
                  if command -v sample >/dev/null 2>&1; then
                    sample "$test_pid" 10 -file ci_macos_sample.txt >/dev/null 2>&1 || true
                  fi
                  if command -v lldb >/dev/null 2>&1; then
                    lldb --batch -p "$test_pid" \
                      -o 'thread backtrace all' \
                      -o 'process save-core ci_macos_hang.core' \
                      -o 'detach' \
                      -o 'quit' > ci_unix_stack_trace.log 2>&1 || true
                  fi
                  kill -TERM "$test_pid" 2>/dev/null || true
                  sleep 5
                  kill -KILL "$test_pid" 2>/dev/null || true
                  wait "$test_pid"
                  exit 124
                fi
                sleep 5
              done
              wait "$test_pid"
              test_status=$?
              kill "$tail_pid" 2>/dev/null || true
              wait "$tail_pid" 2>/dev/null || true
              exit "$test_status"
            )
            test_status=$?
          else
            (cd Test && ./libft_tests) 2>&1 | tee Test/ci_unix_full_output.log
            test_status=${PIPESTATUS[0]}
          fi
          if [ "$test_status" -ne 0 ]; then
            if [ "$RUNNER_OS" = "macOS" ] && [ -f Test/ci_macos_hang_detected.txt ]; then
              printf '%s\n' 'macOS hang diagnostics were already captured.'
            elif command -v gdb >/dev/null 2>&1; then
              (cd Test && gdb -q -batch \
                -ex 'set pagination off' \
                -ex 'set env FT_TEST_HIDE_SUCCESSFUL 0' \
                -ex 'handle SIGABRT nostop noprint pass' \
                -ex 'handle SIGIOT nostop noprint pass' \
                -ex 'handle SIGTERM nostop noprint pass' \
                -ex 'handle SIGINT nostop noprint pass' \
                -ex 'handle SIGHUP nostop noprint pass' \
                -ex run \
                -ex 'thread apply all bt full' \
                --args ./libft_tests) 2>&1 | tee Test/ci_unix_stack_trace.log
            elif command -v lldb >/dev/null 2>&1; then
              (cd Test && lldb --batch \
                -o 'settings set target.env-vars FT_TEST_HIDE_SUCCESSFUL=0' \
                -k 'thread backtrace all' \
                -o run \
                -- ./libft_tests) 2>&1 | tee Test/ci_unix_stack_trace.log
            else
              printf '%s\n' 'No debugger was available for stack trace capture.' | tee Test/ci_unix_stack_trace.log
            fi
          fi
          exit "$test_status"

      - name: Run test suite on Windows
        if: runner.os == 'Windows'
        shell: powershell
        id: windows_tests
        env:
          FT_TEST_HIDE_SUCCESSFUL: '1' # CI_DIAGNOSTIC: Silence successful Windows tests while preserving failures.
          FT_TEST_PRESERVE_FAILURE_LOG: '1' # CI_DIAGNOSTIC: Preserve assertion details for failed Windows runs.
        run: |
          Remove-Item Env:FT_TEST_NAME_FILTER -ErrorAction SilentlyContinue
          Remove-Item Env:FT_TEST_SKIP_NAME_FILTER -ErrorAction SilentlyContinue
          $test_status = 1 # CI_DIAGNOSTIC: Default to failure if process launch itself fails.
          $test_directory_pushed = $false
          $windows_output_path = Join-Path (Get-Location) 'Test\ci_windows_full_output.log'
          try {
            Push-Location Test
            $test_directory_pushed = $true
            & .\libft_tests.exe *> ci_windows_full_output.log # CI_DIAGNOSTIC: Run from Test so relative fixtures resolve correctly.
            $test_status = $LASTEXITCODE # CI_DIAGNOSTIC: Preserve the executable exit status.
          }
          catch {
            $_ | Out-File -FilePath $windows_output_path -Append # CI_DIAGNOSTIC: Preserve launch exceptions.
          }
          finally {
            if ($test_directory_pushed) { Pop-Location }
          }
          Write-Host "Windows test exit code: $test_status" # CI_DIAGNOSTIC: Make native process failures explicit.
          if (Test-Path Test\test_failures.log) { Copy-Item Test\test_failures.log Test\ci_windows_failures.log } # CI_DIAGNOSTIC: Preserve Windows assertion details.
          if (Test-Path Test\secure_wipe_runtime.log) { Copy-Item Test\secure_wipe_runtime.log Test\ci_windows_secure_wipe_runtime.log } # CI_DIAGNOSTIC: Preserve runtime compilation status.
          if (Test-Path Test\secure_wipe_runtime.err) { Copy-Item Test\secure_wipe_runtime.err Test\ci_windows_secure_wipe_runtime.err } # CI_DIAGNOSTIC: Preserve runtime compiler or execution errors.
          if (Test-Path Test\windows_crash_stack_trace.log) { Copy-Item Test\windows_crash_stack_trace.log Test\ci_windows_crash_stack_trace.log } # CI_DIAGNOSTIC: Preserve the native Windows exception stack trace.
          if (Test-Path Test\ci_windows_full_output.log) { Get-Content Test\ci_windows_full_output.log } # CI_DIAGNOSTIC: Make the executable output visible in the Actions log.
          if (Test-Path Test\ci_windows_failures.log) { Get-Content Test\ci_windows_failures.log } # CI_DIAGNOSTIC: Make assertion details visible in the Actions log.
          if (Test-Path Test\secure_wipe_runtime.log) { Get-Content Test\secure_wipe_runtime.log } # CI_DIAGNOSTIC: Make runtime status visible in the Actions log.
          if (Test-Path Test\secure_wipe_runtime.err) { Get-Content Test\secure_wipe_runtime.err } # CI_DIAGNOSTIC: Make runtime compiler errors visible in the Actions log.
          if (Test-Path Test\windows_crash_stack_trace.log) { Get-Content Test\windows_crash_stack_trace.log } # CI_DIAGNOSTIC: Print the native Windows exception stack trace.
          if ($test_status -ne 0) { # CI_DIAGNOSTIC: Capture a debugger backtrace for fail-fast heap corruption.
            $gdb_command = Get-Command gdb.exe -ErrorAction SilentlyContinue
            if ($null -ne $gdb_command) {
              Write-Host "Windows test failed; rerunning under MinGW GDB."
              @(
                'set pagination off'
                'set confirm off'
                'handle SIGTRAP stop print pass'
                'handle SIGABRT stop print pass'
                'break RtlReportFatalFailure'
                'break RtlRaiseStatus'
                'break RtlHeapReportCorruptionFailure'
                'run'
                'thread apply all bt full'
                'quit'
              ) | Set-Content -Path Test\ci_windows_gdb_commands.txt
              $saved_error_action = $ErrorActionPreference
              $ErrorActionPreference = 'Continue'
              & $gdb_command.Source --batch --nx `
                -x Test\ci_windows_gdb_commands.txt `
                .\Test\libft_tests.exe *> Test\ci_windows_gdb.log
              $gdb_status = $LASTEXITCODE
              $ErrorActionPreference = $saved_error_action
              Write-Host "GDB exit code: $gdb_status"
              if (Test-Path Test\ci_windows_gdb.log) {
                Get-Content Test\ci_windows_gdb.log
              }
            }
            else {
              Write-Host "MinGW GDB was not available on the Windows runner."
            }
          }
          exit $test_status # CI_DIAGNOSTIC: Keep the Windows test result authoritative.

      - name: Build performance benchmarks
        if: always()
        shell: bash
        run: |
          make -j4 performance_benchmarks

      - name: Run performance benchmarks on Unix
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          make run_performance_benchmarks

      - name: Run performance benchmarks on Windows
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          & .\Test\libft_efficiency_tests.exe
          exit $LASTEXITCODE

      - name: Upload performance benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: performance-benchmarks-${{ matrix.os }}-${{ github.run_id }}
          path: |
            Test/performance_benchmarks.json
            Test/performance_benchmarks_failed.json
          if-no-files-found: warn

      # CI_DIAGNOSTIC: Re-run each known Ubuntu failure separately with full output and preserved assertion logs.
      - name: Diagnose Ubuntu test failures
        if: failure() && runner.os == 'Linux' # CI_DIAGNOSTIC: Run diagnostics only after the Ubuntu suite fails.
        shell: bash # CI_DIAGNOSTIC: Use the same shell as the Ubuntu test runner.
        run: |
          set +e # CI_DIAGNOSTIC: Continue collecting all failure evidence after an individual test fails.
          for test_name in test_cma_scma_secure_wipe_runtime_compilation_and_cleanup test_terrain_generate_chunk_clears_previous_voxel_data test_thread_pool_cancellation_allows_execution; do # CI_DIAGNOSTIC: Re-run each currently failing test independently.
            (cd Test && FT_TEST_NAME_FILTER="$test_name" FT_TEST_HIDE_SUCCESSFUL=0 FT_TEST_PRESERVE_FAILURE_LOG=1 ./libft_tests) > "Test/ci_ubuntu_${test_name}_output.log" 2>&1 # CI_DIAGNOSTIC: Capture complete targeted test output.
            cp Test/test_failures.log "Test/ci_ubuntu_${test_name}_failures.log" # CI_DIAGNOSTIC: Preserve assertion file before the next targeted run resets it.
            if [ -f Test/secure_wipe_runtime.log ]; then cp Test/secure_wipe_runtime.log "Test/ci_ubuntu_${test_name}_secure_wipe_runtime.log"; fi # CI_DIAGNOSTIC: Preserve runtime compilation status.
            if [ -f Test/secure_wipe_runtime.err ]; then cp Test/secure_wipe_runtime.err "Test/ci_ubuntu_${test_name}_secure_wipe_runtime.err"; fi # CI_DIAGNOSTIC: Preserve runtime compiler or execution errors.
            cat "Test/ci_ubuntu_${test_name}_output.log" # CI_DIAGNOSTIC: Print targeted output into the Actions log.
            cat "Test/ci_ubuntu_${test_name}_failures.log" # CI_DIAGNOSTIC: Print exact assertion details into the Actions log.
            if [ -f "Test/ci_ubuntu_${test_name}_secure_wipe_runtime.log" ]; then cat "Test/ci_ubuntu_${test_name}_secure_wipe_runtime.log"; fi # CI_DIAGNOSTIC: Print runtime status into the Actions log.
            if [ -f "Test/ci_ubuntu_${test_name}_secure_wipe_runtime.err" ]; then cat "Test/ci_ubuntu_${test_name}_secure_wipe_runtime.err"; fi # CI_DIAGNOSTIC: Print runtime compiler errors into the Actions log.
          done # CI_DIAGNOSTIC: Finish all targeted reruns.
          uname -a # CI_DIAGNOSTIC: Record the Ubuntu kernel and architecture.
          c++ --version # CI_DIAGNOSTIC: Record the active C++ compiler.
          make --version # CI_DIAGNOSTIC: Record the active Make version.
          git status --short # CI_DIAGNOSTIC: Record generated files and repository state after testing.

      # CI_DIAGNOSTIC: Upload targeted logs so assertion details remain available after the job ends.
      - name: Upload Ubuntu diagnostic logs
        if: always() && failure() && runner.os == 'Linux' # CI_DIAGNOSTIC: Upload evidence whenever Ubuntu tests fail.
        uses: actions/upload-artifact@v6 # CI_DIAGNOSTIC: Store diagnostic output for offline inspection.
        with:
          name: ubuntu-test-diagnostics-${{ github.run_id }} # CI_DIAGNOSTIC: Give each diagnostic bundle a unique name.
          path: | # CI_DIAGNOSTIC: Include full and targeted output plus assertion logs.
            Test/ci_ubuntu_*_output.log
            Test/ci_ubuntu_*_failures.log
            Test/ci_ubuntu_*_secure_wipe_runtime.log
            Test/ci_ubuntu_*_secure_wipe_runtime.err
            Test/ci_unix_full_output.log
            Test/ci_unix_stack_trace.log
            Test/ci_macos_sample.txt
            Test/ci_macos_hang_detected.txt
            Test/ci_macos_hang.core
            test_failures.log
          if-no-files-found: warn # CI_DIAGNOSTIC: Do not hide the original test failure if a log is unavailable.

      # CI_DIAGNOSTIC: Upload macOS watchdog output, stack traces, and core dumps.
      - name: Upload macOS hang diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: macos-test-diagnostics-${{ github.run_id }}
          path: |
            Test/ci_unix_full_output.log
            Test/ci_unix_stack_trace.log
            Test/ci_macos_sample.txt
            Test/ci_macos_hang_detected.txt
            Test/ci_macos_hang.core
            test_failures.log
          if-no-files-found: warn

      # CI_DIAGNOSTIC: Upload Windows output while the cross-platform test failures are being diagnosed.
      - name: Upload Windows diagnostic logs
        if: always() && failure() && runner.os == 'Windows' # CI_DIAGNOSTIC: Upload evidence whenever Windows tests fail.
        uses: actions/upload-artifact@v6 # CI_DIAGNOSTIC: Store Windows test and runtime evidence.
        with:
          name: windows-test-diagnostics-${{ github.run_id }} # CI_DIAGNOSTIC: Give each diagnostic bundle a unique name.
          path: | # CI_DIAGNOSTIC: Include Windows test output and runtime failure details.
            Test/ci_windows_full_output.log
            Test/ci_windows_failures.log
            Test/ci_windows_secure_wipe_runtime.log
            Test/ci_windows_secure_wipe_runtime.err
            Test/ci_windows_crash_stack_trace.log
            Test/ci_windows_gdb.log
            Test/ci_windows_gdb_commands.txt
            test_failures.log
          if-no-files-found: warn # CI_DIAGNOSTIC: Do not hide the original Windows test failure if a log is unavailable.
